[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-mesh-morpher"
version = "0.13.0"
description = "Mesh morphing tools for EMSolution workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Perimeter-1.0.1"
license-files = ["LICENSE"]
authors = [
    { name = "Science Solutions International Laboratory, Inc." },
]
keywords = ["mesh", "morphing", "CAE", "finite-element", "EMSolution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ems-file-format-converter>=0.6.0",
    "meshio>=5.0",
    "numpy>=1.20",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ems-mesh-morph = "ems_mesh_morpher.cli:main"

[project.urls]
Homepage = "https://github.com/EMSolution-SSIL/ems_mesh_morpher"
Repository = "https://github.com/EMSolution-SSIL/ems_mesh_morpher"
Issues = "https://github.com/EMSolution-SSIL/ems_mesh_morpher/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ems_mesh_morpher*"]
